[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termbox-runner"
version = "0.1.0"
description = "Deterministic sandboxed task runner and evaluation harness for coding/CLI agents and verifiers"
authors = [
    { name = "Fardeen", email = "itzfardeen143@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "docker>=7.0.0",
    "jinja2>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[project.scripts]
termbox-runner = "termbox_runner.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/termbox_runner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
